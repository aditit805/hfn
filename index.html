<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meditation Check-in · Heartfulness Singapore</title>
<meta name="description" content="Check in to Heartfulness Singapore meditation sessions in one tap.">
<meta name="theme-color" content="#dcecf8">
<meta name="apple-mobile-web-app-title" content="HFN Check-in">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 86C22 66 10 50 10 34 10 22 19 13 31 13c8 0 15 4 19 11 4-7 11-11 19-11 12 0 21 9 21 21 0 16-12 32-40 52z' fill='%23f4a99a'/%3E%3C/svg%3E">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  :root {
    --sky: #c0daee; --sky-soft: #e8f2fa; --dawn: #fdf3e7; --navy: #173e5f; --navy-2: #2b5f8c;
    --ink: #1d3247; --muted: #6b7f92; --card: rgba(255,255,255,.78); --line: rgba(23,62,95,.12);
    --gold: #e9b872; --ok: #3d8b6a; --ok-bg: rgba(220,240,230,.85); --err: #b3261e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 400 16px/1.5 Poppins, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(175deg, #dcecf8 0%, var(--sky-soft) 38%, var(--dawn) 100%) fixed;
    overflow-x: hidden;
  }
  /* drifting light, like morning clouds */
  .glow { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .55; z-index: 0; pointer-events: none; }
  .g1 { width: 320px; height: 320px; background: #fff; top: -80px; left: -90px; animation: drift 18s ease-in-out infinite alternate; }
  .g2 { width: 260px; height: 260px; background: #f8dcc0; bottom: 40px; right: -100px; animation: drift 22s ease-in-out infinite alternate-reverse; }
  .g3 { width: 220px; height: 220px; background: var(--sky); top: 40%; left: -120px; animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }

  main { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 14px 16px 150px; }
  header { text-align: center; margin-bottom: 14px; }
  .logo { position: relative; display: inline-block; margin: 0 0 8px; }
  .logo::before {
    content: ""; position: absolute; inset: -26px -30px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,236,205,.95), rgba(255,236,205,0));
    animation: breathe 6s ease-in-out infinite;
  }
  .logo img { position: relative; display: block; height: 34px; width: auto; }
  .heart { width: 84px; height: 84px; margin: 0 auto 10px; position: relative; }
  .heart::before {
    content: ""; position: absolute; inset: -18px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,226,180,.9) 0%, rgba(255,226,180,0) 70%);
    animation: breathe 6s ease-in-out infinite;
  }
  .heart svg { position: relative; width: 100%; height: 100%; animation: breathe-s 6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(.85); opacity: .55; } 50% { transform: scale(1.12); opacity: 1; } }
  @keyframes breathe-s { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.04); } }
  .greet { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--navy-2); margin: 0; }
  h1 { font: italic 500 32px/1.15 "Cormorant Garamond", Georgia, serif; color: var(--navy); margin: 6px 0 4px; }
  .sub { color: var(--muted); margin: 0; font-size: 14px; font-weight: 300; }
  .breath { color: var(--navy-2); font-size: 13px; font-weight: 300; margin: 6px 0 0; opacity: .85; }

  .section-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 4px 10px; }
  .empty { background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border: 1px dashed rgba(23,62,95,.25); border-radius: 22px; padding: 26px 20px; text-align: center;
           color: var(--muted); font-weight: 300; }

  .person {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid transparent; border-radius: 20px; padding: 10px 8px 10px 14px; margin-bottom: 8px;
    box-shadow: 0 6px 20px rgba(23,62,95,.07); cursor: pointer; user-select: none;
    transition: transform .15s ease, border-color .2s, background .2s;
  }
  .person:active { transform: scale(.985); }
  .person.sel { border-color: var(--navy-2); background: rgba(255,255,255,.95); }
  .person.done { background: var(--ok-bg); cursor: default; box-shadow: none; }
  .box {
    flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(23,62,95,.3);
    display: grid; place-items: center; color: transparent; font-size: 15px; transition: all .2s;
  }
  .sel .box { background: var(--navy); border-color: var(--navy); color: #fff; }
  .done .box { background: var(--ok); border-color: var(--ok); color: #fff; }
  .info { flex: 1; min-width: 0; }
  .nm { font-weight: 500; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; font-weight: 300; }
  .done .meta { color: var(--ok); font-weight: 400; }
  .err .meta { color: var(--err); }
  .edit { flex: none; background: none; border: 0; color: var(--muted); font: 400 13px Poppins, sans-serif;
          padding: 10px; cursor: pointer; }

  .row[hidden] { display: none; }
  .row { display: flex; gap: 16px; margin: 0 6px; }
  .link { background: none; border: 0; color: var(--navy-2); font: 500 14px Poppins, sans-serif; padding: 6px 0; cursor: pointer; }

  button.primary {
    width: 100%; border: 0; border-radius: 999px; padding: 17px; font: 500 17px Poppins, sans-serif; letter-spacing: .02em;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; cursor: pointer;
    box-shadow: 0 10px 28px rgba(23,62,95,.28); transition: transform .15s, opacity .2s;
  }
  button.primary:active { transform: scale(.98); }
  button.primary:disabled { opacity: .4; box-shadow: none; cursor: default; }
  button.ghost {
    width: 100%; border: 1.5px dashed rgba(23,62,95,.3); background: rgba(255,255,255,.4); border-radius: 22px;
    padding: 15px; font: 400 15px Poppins, sans-serif; color: var(--navy); cursor: pointer;
  }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 22px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(253,243,231,0), var(--dawn) 45%);
  }
  .bar > div { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .bar .ghost { padding: 12px; border-radius: 999px; background: rgba(255,255,255,.85); font-weight: 500; }

  /* Add / edit sheet */
  .sheet { position: fixed; inset: 0; background: rgba(23,62,95,.28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
           display: none; align-items: flex-end; z-index: 10; }
  .sheet.open { display: flex; }
  .panel {
    background: #fff; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 26px 26px 0 0;
    padding: 8px 18px calc(14px + env(safe-area-inset-bottom)); max-height: 100%; overflow-y: auto;
    animation: up .28s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: #dde5ec; margin: 0 auto 8px; }
  .panel h2 { margin: 0; font: italic 500 25px/1.2 "Cormorant Garamond", Georgia, serif; color: var(--navy); }
  label.f { display: block; font-weight: 500; margin: 12px 0 6px; font-size: 13px; line-height: 1.3; color: var(--navy); }
  input[type=text] {
    width: 100%; padding: 11px 14px; font: 400 16px Poppins, sans-serif; border: 1.5px solid #dbe5ee; border-radius: 14px;
    background: #f8fbfd; color: var(--ink);
  }
  input[type=text]:focus { outline: none; border-color: var(--navy-2); background: #fff; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button {
    flex: 1 1 0; padding: 9px 10px; border: 1.5px solid #dbe5ee; border-radius: 999px;
    background: #fff; font: 400 14px Poppins, sans-serif; color: var(--ink); cursor: pointer; transition: all .15s;
  }
  .seg button.on { border-color: var(--navy); background: var(--navy); color: #fff; }
  #fCity { margin-top: 8px; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .chips button { padding: 8px 4px; font-size: 12.5px; line-height: 1.2; border-radius: 12px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .primary { padding: 13px; }
  .actions .primary { flex: 2; }
  .actions .cancel { flex: 1; border: 0; background: #eef3f7; border-radius: 999px; font: 400 15px Poppins, sans-serif; color: var(--navy); cursor: pointer; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .del { background: none; border: 0; color: var(--err); font: 400 14px Poppins, sans-serif; padding: 8px; cursor: pointer; }

  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--navy); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; z-index: 30;
    pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* welcome after check-in */
  .welcome { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; text-align: center; padding: 24px;
             background: radial-gradient(circle at 50% 40%, #fff7ea 0%, #e3eff9 55%, #c9dff0 100%); }
  .welcome.open { display: grid; animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; } }
  .welcome .heart { width: 110px; height: 110px; margin-bottom: 16px; }
  .welcome h2 { font: italic 500 38px/1.1 "Cormorant Garamond", Georgia, serif; color: var(--navy); margin: 0 0 10px; }
  .welcome p { color: var(--navy-2); margin: 0 auto 6px; max-width: 300px; font-weight: 300; }
  .welcome .names { font-weight: 500; color: var(--navy); }
  .welcome button { margin-top: 28px; max-width: 220px; }
  .petal { position: absolute; bottom: -20px; font-size: 18px; opacity: 0; animation: rise 5s ease-out forwards; pointer-events: none; }
  @keyframes rise { 10% { opacity: .9; } 100% { transform: translateY(-105vh) translateX(var(--dx)) rotate(var(--rot)); opacity: 0; } }

  /* small phones */
  @media (max-width: 360px) {
    h1 { font-size: 29px; }
    .heart { width: 70px; height: 70px; }
    .person { padding: 12px 6px 12px 12px; gap: 10px; }
    .seg button { font-size: 13px; }
    .chips button { font-size: 11.5px; }
  }
  /* tablets / desktop: centred dialog instead of bottom sheet, roomier header */
  @media (min-width: 640px) {
    main { padding-top: 56px; max-width: 520px; }
    h1 { font-size: 42px; }
    .heart { width: 100px; height: 100px; }
    .sheet { align-items: center; padding: 24px; }
    .panel { border-radius: 28px; padding: 24px 28px 20px; max-width: 520px; box-shadow: 0 30px 80px rgba(23,62,95,.25); }
    .grab { display: none; }
    .bar > div { max-width: 520px; }
    .person:hover:not(.done) { border-color: rgba(43,95,140,.45); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>

    <p class="greet" id="greet">Welcome</p>
    <h1>Meditation Check-in</h1>
    <p class="sub">Heartfulness Singapore · <span id="today"></span></p>
    <p class="breath">Take a gentle breath — you’ve arrived.</p>
  </header>

  <p class="section-label" id="listLabel" hidden>Who’s here today?</p>
  <div id="list"></div>

  <div class="row" id="selRow" hidden>
    <button class="link" id="selAll">Select all</button>
    <button class="link" id="selNone">Clear</button>
  </div>
</main>

<div class="bar"><div>
  <button class="ghost" id="addBtn" >＋ Add someone</button>
  <button class="primary" id="checkIn" disabled>Check in</button>
</div></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Add a person</h2>
      <button class="del" id="delBtn" hidden>Remove</button>
    </div>

    <label class="f" for="fName">Name</label>
    <input type="text" id="fName" autocomplete="name" placeholder="Full name">

    <label class="f">Where do you currently live?</label>
    <div class="seg" id="fLives">
      <button data-v="Singapore">Singapore</button>
      <button data-v="Outside Singapore">Outside Singapore</button>
    </div>

    <input type="text" id="fCity" hidden aria-label="Country / City" placeholder="Country / City, e.g. India / Chennai">

    <label class="f">First time attending a Heartfulness session?</label>
    <div class="seg" id="fFirst">
      <button data-v="no">No</button>
      <button data-v="yes">Yes</button>
    </div>

    <div id="heardWrap" hidden>
      <label class="f">How did you hear about us? <span style="font-weight:300;color:var(--muted)">(pick any)</span></label>
      <div class="seg chips" id="fHeard"></div>
    </div>

    <div class="actions">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="welcome" id="welcome">
  <div>
    <div class="heart"><svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset=".55" stop-color="#f4a99a"/><stop offset="1" stop-color="#2b5f8c"/></linearGradient></defs>
      <path d="M50 86C22 66 10 50 10 34 10 22 19 13 31 13c8 0 15 4 19 11 4-7 11-11 19-11 12 0 21 9 21 21 0 16-12 32-40 52z" fill="url(#hg2)" opacity=".92"/>
      <circle cx="50" cy="42" r="7" fill="#fff" opacity=".85"/>
    </svg></div>
    <h2>Welcome home</h2>
    <p class="names" id="welcomeNames"></p>
    <p>You’re checked in. Please proceed to the meditation hall.</p>
    <button class="primary" id="welcomeClose">Thank you</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var STORE_KEY = 'sundayCheckin.people.v1';
  var API_URL = (window.HFN_CONFIG && window.HFN_CONFIG.appsScriptUrl || '').trim();
  var HEARD = ['Friend / Family', 'WhatsApp', 'Instagram / Facebook', 'Heartfulness website',
               'Heartfulness App', 'Community / Organisation', 'Flyer / Poster', 'Workplace / School', 'Other'];

  var people = load();      // [{id, name, lives, city, firstTime, heardFrom, lastCheckIn}]
  var selected = {};        // id -> true
  var sendState = {};       // id -> 'sending' | 'error:<msg>'  (not `status`: that's window.status, always a string)
  var editingId = null;
  var draft = null;
  var justIn = [];          // names checked in by the current tap, for the welcome screen

  function $(id) { return document.getElementById(id); }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(people)); }
    catch (e) { toast('Could not save on this device'); }
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function doneToday(p) { return p.lastCheckIn === todayKey(); }
  // "9:42 am" for today, "Sun 18 Oct" otherwise — from the time this device last checked them in.
  function lastSeen(p) {
    if (!p.lastCheckInAt) return '';
    var d = new Date(p.lastCheckInAt);
    return doneToday(p) ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })
                        : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  }

  // ---------- list ----------
  function render() {
    $('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    var h = new Date().getHours();
    $('greet').textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    $('listLabel').hidden = !people.length;
    var list = $('list');
    if (!people.length) {
      list.innerHTML = '<div class="empty">Add yourself, and anyone you check in for.<br>This phone will remember them, so next time it’s just one tap.<br><br>Tap <b>＋ Add someone</b> below to begin.</div>';
    } else {
      list.innerHTML = people.map(function (p) {
        var st = sendState[p.id] || '';
        var cls = 'person' + (doneToday(p) ? ' done' : selected[p.id] ? ' sel' : '') + (st.indexOf('error') === 0 ? ' err' : '');
        var where = (p.lives === 'Outside Singapore' ? (p.city || 'Overseas') : 'Singapore') + (p.firstTime ? ' · first visit' : '');
        var meta = doneToday(p) ? 'Checked in today' + (p.lastCheckInAt ? ' · ' + lastSeen(p) : '')
          : st === 'sending' ? 'Checking in…'
          : st.indexOf('error') === 0 ? 'Failed — tap Check in to retry'
          : where + (p.lastCheckInAt ? ' · last in ' + lastSeen(p) : '');
        return '<div class="' + cls + '" data-id="' + p.id + '">' +
          '<div class="box">✓</div>' +
          '<div class="info"><div class="nm">' + esc(p.name) + '</div><div class="meta">' + esc(meta) + '</div></div>' +
          '<button class="edit" data-edit="' + p.id + '">Edit</button></div>';
      }).join('');
    }
    var pending = people.filter(function (p) { return !doneToday(p); });
    $('selRow').hidden = pending.length < 2;
    var n = pending.filter(function (p) { return selected[p.id]; }).length;
    var sending = Object.keys(sendState).some(function (k) { return sendState[k] === 'sending'; });
    var btn = $('checkIn');
    btn.disabled = !n || sending;
    btn.textContent = sending ? 'Checking in…'
      : n ? 'Check in ' + n + (n === 1 ? ' person' : ' people')
      : people.length && !pending.length ? 'All checked in ✓'
      : people.length ? 'Tap names to check in'
      : 'Check in';
  }

  $('list').addEventListener('click', function (e) {
    var ed = e.target.closest('[data-edit]');
    if (ed) { openSheet(ed.getAttribute('data-edit')); return; }
    var row = e.target.closest('.person');
    if (!row) return;
    var p = byId(row.getAttribute('data-id'));
    if (!p || sendState[p.id] === 'sending') return;
    if (doneToday(p)) { toast(p.name + ' is already checked in today'); return; }
    selected[p.id] = !selected[p.id];
    render();
  });
  $('selAll').onclick = function () { people.forEach(function (p) { if (!doneToday(p)) selected[p.id] = true; }); render(); };
  $('selNone').onclick = function () { selected = {}; render(); };

  function byId(id) { for (var i = 0; i < people.length; i++) if (people[i].id === id) return people[i]; return null; }

  // ---------- submit ----------
  $('checkIn').onclick = function () {
    var batch = people.filter(function (p) { return selected[p.id] && !doneToday(p); });
    if (!batch.length) return;
    justIn = [];
    batch.forEach(function (p) {
      sendState[p.id] = 'sending';
      var payload = { name: p.name, lives: p.lives, city: p.city, firstTime: !!p.firstTime, heardFrom: p.heardFrom || [] };
      send(payload)
        .then(function (res) { finish(p.id, res && res.ok ? null : (res && res.error) || 'Unknown error'); })
        .catch(function () { finish(p.id, 'Could not connect — check your internet'); });
    });
    render();
  };

  // Posts to the Apps Script web app (see apps-script/Code.gs). text/plain keeps it a
  // "simple" request, so the browser skips the CORS preflight Apps Script can't answer.
  function send(payload) {
    if (!API_URL) return Promise.resolve({ ok: false, error: 'Check-in is not set up yet (missing Apps Script link)' });
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json(); });
  }

  function finish(id, error) {
    var p = byId(id);
    if (!p) return;
    if (error) {
      sendState[id] = 'error:' + error;
      toast(p.name + ': ' + error);
    } else {
      delete sendState[id];
      delete selected[id];
      p.lastCheckIn = todayKey();
      p.lastCheckInAt = new Date().toISOString();
      p.firstTime = false;   // next week they're a returning participant
      save();
      justIn.push(p.name);
    }
    render();
    var still = Object.keys(sendState).some(function (k) { return sendState[k] === 'sending'; });
    if (!still && justIn.length) showWelcome(justIn);
  }

  function showWelcome(names) {
    $('welcomeNames').textContent = names.length > 3 ? names.slice(0, 3).join(', ') + ' + ' + (names.length - 3) + ' more' : names.join(', ');
    var w = $('welcome');
    w.querySelectorAll('.petal').forEach(function (n) { n.remove(); });
    var marks = ['♡', '✿', '❀', '·', '♡'];
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('span');
      s.className = 'petal';
      s.textContent = marks[i % marks.length];
      s.style.left = (Math.random() * 100) + '%';
      s.style.color = ['#f4a99a', '#e9b872', '#2b5f8c', '#c0daee'][i % 4];
      s.style.animationDelay = (Math.random() * 1.6) + 's';
      s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      s.style.setProperty('--rot', (Math.random() * 240 - 120) + 'deg');
      w.appendChild(s);
    }
    w.classList.add('open');
  }

  $('welcomeClose').onclick = function () { $('welcome').classList.remove('open'); };

  // ---------- add / edit sheet ----------
  // Short labels so all nine options fit on screen; the full text is what gets submitted.
  var HEARD_SHORT = { 'Instagram / Facebook': 'Insta / FB', 'Heartfulness website': 'HFN website', 'Heartfulness App': 'HFN App',
                      'Community / Organisation': 'Community', 'Workplace / School': 'Work / School' };
  $('fHeard').innerHTML = HEARD.map(function (h) {
    return '<button data-v="' + esc(h) + '" title="' + esc(h) + '">' + esc(HEARD_SHORT[h] || h) + '</button>';
  }).join('');

  function openSheet(id) {
    editingId = id || null;
    var p = id ? byId(id) : null;
    draft = p ? { name: p.name, lives: p.lives, city: p.city || '', firstTime: !!p.firstTime, heardFrom: (p.heardFrom || []).slice() }
              : { name: '', lives: 'Singapore', city: '', firstTime: false, heardFrom: [] };
    $('sheetTitle').textContent = p ? 'Edit person' : 'Add a person';
    $('delBtn').hidden = !p;
    $('fName').value = draft.name;
    $('fCity').value = draft.city;
    syncSheet();
    $('sheet').classList.add('open');
    if (!p) setTimeout(function () { $('fName').focus(); }, 50);
  }
  function closeSheet() { $('sheet').classList.remove('open'); }

  function syncSheet() {
    setOn('fLives', function (v) { return v === draft.lives; });
    setOn('fFirst', function (v) { return (v === 'yes') === draft.firstTime; });
    setOn('fHeard', function (v) { return draft.heardFrom.indexOf(v) >= 0; });
    $('fCity').hidden = draft.lives !== 'Outside Singapore';
    $('heardWrap').hidden = !draft.firstTime;
  }
  function setOn(groupId, test) {
    Array.prototype.forEach.call($(groupId).children, function (b) { b.classList.toggle('on', test(b.getAttribute('data-v'))); });
  }

  $('fLives').onclick = function (e) { var b = e.target.closest('button'); if (b) { draft.lives = b.getAttribute('data-v'); syncSheet(); } };
  $('fFirst').onclick = function (e) { var b = e.target.closest('button'); if (b) { draft.firstTime = b.getAttribute('data-v') === 'yes'; syncSheet(); } };
  $('fHeard').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var v = b.getAttribute('data-v'), i = draft.heardFrom.indexOf(v);
    if (i >= 0) draft.heardFrom.splice(i, 1); else draft.heardFrom.push(v);
    syncSheet();
  };

  $('addBtn').onclick = function () { openSheet(); };
  $('cancelBtn').onclick = closeSheet;
  $('sheet').onclick = function (e) { if (e.target === this) closeSheet(); };

  $('saveBtn').onclick = function () {
    draft.name = $('fName').value.trim();
    draft.city = $('fCity').value.trim();
    if (!draft.name) { toast('Please enter a name'); $('fName').focus(); return; }
    if (draft.lives === 'Outside Singapore' && !draft.city) { toast('Please enter country / city'); $('fCity').focus(); return; }
    if (draft.firstTime && !draft.heardFrom.length) { toast('Pick how they heard about us'); return; }
    if (draft.lives !== 'Outside Singapore') draft.city = '';
    if (!draft.firstTime) draft.heardFrom = [];

    if (editingId) {
      var p = byId(editingId);
      Object.assign(p, draft);
    } else {
      var np = Object.assign({ id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), lastCheckIn: null }, draft);
      people.push(np);
    }
    save();
    closeSheet();
    render();
  };

  $('delBtn').onclick = function () {
    var p = byId(editingId);
    if (!p || !confirm('Remove ' + p.name + ' from this phone?')) return;
    people = people.filter(function (x) { return x.id !== editingId; });
    delete selected[editingId]; delete sendState[editingId];
    save(); closeSheet(); render();
  };

  // Nothing is pre-selected: every check-in is an explicit tap on a person.
  render();
</script>
</body>
</html>
